<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{%title%}</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/docs.css">
<script>
  // Apply saved theme immediately to prevent flash
  (function() {
    var theme = localStorage.getItem('theme');
    if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>
  <div class="banner">
    <div class="title">
        <a href="/">
            <img class="logo" src="/static/plywood-house-small.png" srcset="/static/plywood-house-small.png 1x, /static/plywood-house-small@2x.png 2x" alt="Plywood logo" style="position: absolute; left: 19px; top: 5px;">
            <span style="font-size: 22px; position: absolute; left: 73px; top: 10px;">Plywood</span>
        </a>
        <span class="right">
          <div id="nav-links"><a href="/docs/intro"><span class="nav-link">DOCS</span></a><a href="https://github.com/preshing/plywood" target="_blank"><span class="nav-link">GITHUB</span></a>
            <span class="theme-toggle-parent"><button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark/light mode"></button></span>
          </div>
            <span class="mobile-banner-actions">
              <a class="banner-github" href="https://github.com/preshing/plywood" target="_blank"
                 title="View on GitHub" aria-label="View on GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58 0-.29-.01-1.06-.02-2.08-3.34.73-4.04-1.61-4.04-1.61-.55-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.48 1 .11-.77.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.53.12-3.18 0 0 1.01-.32 3.31 1.23.96-.27 1.99-.4 3.02-.4 1.02 0 2.05.13 3.02.4 2.3-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.82 1.1.82 2.22 0 1.6-.02 2.89-.02 3.29 0 .32.22.69.83.58A12 12 0 0 0 24 12c0-6.63-5.37-12-12-12z"></path>
                </svg>
              </a>
              <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark/light mode"></button>
              <span id="hamburger" class="button"></span>
            </span>
        </span>
    </div>
  </div>
  <div class="inner-body">  
  <div class="directory">
    <div class="scroller">
      <div class="inner">
        <div class="docs-sidebar-header">
          <span class="docs-sidebar-actions">
            <a class="docs-sidebar-github" href="https://github.com/preshing/plywood" target="_blank"
               title="View on GitHub" aria-label="View on GitHub">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58 0-.29-.01-1.06-.02-2.08-3.34.73-4.04-1.61-4.04-1.61-.55-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.48 1 .11-.77.42-1.3.76-1.6-2.66-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.53.12-3.18 0 0 1.01-.32 3.31 1.23.96-.27 1.99-.4 3.02-.4 1.02 0 2.05.13 3.02.4 2.3-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.82 1.1.82 2.22 0 1.6-.02 2.89-.02 3.29 0 .32.22.69.83.58A12 12 0 0 0 24 12c0-6.63-5.37-12-12-12z"></path>
              </svg>
            </a>
            <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark/light mode"></button>
          </span>
          <a class="docs-sidebar-home" href="/">
            <img class="logo" src="/static/plywood-house-small.png"
                 srcset="/static/plywood-house-small.png 1x, /static/plywood-house-small@2x.png 2x" alt="Plywood logo">
            <span class="docs-sidebar-home-label">Plywood</span>
          </a>
        </div>
        <div class="toc-heading">DOCUMENTATION</div>
        <ul>
{%toc%}
        </ul>
      </div>
    </div>
  </div>
  <div class="content-parent"><article class="content" id="article">
{%content%}
  </article></div>
  <script src="/static/common.js"></script>
  <script src="/static/doc-viewer.js"></script>
</div></body>
</html>
